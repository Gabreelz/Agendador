# Configuração comum a todos os profiles.
# SEGREDOS: nunca colocar valores aqui. Use apenas ${VARIAVEL} sem default.
spring:
  application:
    name: scheduler-app
  profiles:
    default: dev            # usado quando SPRING_PROFILES_ACTIVE não está definido

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never   # tabelas criadas pela migration V1
    scheduler-name: ${spring.application.name}
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 5

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    admin:
      username: ${APP_ADMIN_USER}
      password: ${APP_ADMIN_PASSWORD}
