# Configuração comum a todos os profiles.
# SEGREDOS: nunca colocar valores aqui. Use apenas ${VARIAVEL} sem default.
spring:
  application:
    name: scheduler-app
  profiles:
    default: dev            # usado quando SPRING_PROFILES_ACTIVE não está definido

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never           # as tabelas QRTZ_* vêm da migration V2 (Flyway)
    scheduler-name: ${spring.application.name}
    overwrite-existing-jobs: false
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      # --- Cluster: todas as instâncias apontam para o MESMO banco e as MESMAS tabelas ---
      org.quartz.scheduler.instanceId: AUTO            # id único por instância (host + timestamp)
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 7500 # ms entre "estou vivo" de cada nó
      # --- Persistência ---
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      # --- Misfire: tolerância (ms) antes de considerar um disparo "perdido" ---
      org.quartz.jobStore.misfireThreshold: ${QUARTZ_MISFIRE_THRESHOLD_MS:60000}
      # --- Pool de threads que executam os jobs ---
      org.quartz.threadPool.threadCount: ${QUARTZ_THREADS:5}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    admin:
      username: ${APP_ADMIN_USER}
      password: ${APP_ADMIN_PASSWORD}

server:
  error:                    # fallback do Boot (/error): nunca expor detalhes internos
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"