# Produção: tudo vem de variáveis de ambiente (nenhum default para segredos).
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
